name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - "dev_*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Verify the package installs cleanly for every OS / Python / extras combo ──
  install:
    name: "install [${{ matrix.extras || 'base' }}] py${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        extras: ["", "dev", "all"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true   # needed for 3.14, harmless for earlier versions

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package
        shell: bash
        run: |
          EXTRAS="${{ matrix.extras }}"
          if [ -n "$EXTRAS" ]; then
            pip install ".[$EXTRAS]"
          else
            pip install "."
          fi

      - name: Confirm package is registered
        run: pip show tachywooting

      - name: List installed extras
        shell: bash
        run: |
          python -c "
          import importlib.util, sys
          for pkg in ['h5py', 'numpy', 'matplotlib', 'rich', 'tqdm', 'cffi']:
              ok = importlib.util.find_spec(pkg) is not None
              print(f'  {pkg:<20} {\"OK\" if ok else \"MISSING\"}')
          "

  # ── Run hardware-free pytest suite across all OS / Python versions ──────────
  test:
    name: "pytest py${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package with dev extras
        run: pip install ".[dev]"

      - name: Show test environment
        run: pip list

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── Verify the native CFFI interface actually compiles on each OS ───────────
  # One Python version is enough here — the `install` job's matrix already
  # compiles this extension on every supported version. This job instead
  # exercises the standalone wooting-build-interface rebuild path and
  # inspects the resulting binary (ldd, successful import).
  build-interface:
    name: "build interface / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install "."

      - name: Build native interface
        run: python -c "from tachywooting.package_setup import build_interface_if_needed; build_interface_if_needed()"

      - name: Show compiled extension dependencies (debug)
        if: runner.os == 'Linux'
        run: |
          SO_PATH=$(python -c "import glob; print(glob.glob('tachywooting/interface/wooting_interface*.so')[0])")
          echo "Extension: $SO_PATH"
          ldd "$SO_PATH" || true

      - name: Confirm interface loaded
        run: |
          python -c "
          import importlib
          try:
              mod = importlib.import_module('tachywooting.interface.wooting_interface')
          except Exception as e:
              raise SystemExit(f'native module import failed: {e!r}')
          import tachywooting
          assert tachywooting.lib is not None and tachywooting.ffi is not None, 'native interface failed to load after build'
          "
